spring.application.name=psoft-g1

##
## Profiles
##
spring.profiles.active=bootstrap

##
## OpenAPI
##
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

##
## JWT
##
jwt.private.key=classpath:rsa.private.key
jwt.public.key=classpath:rsa.public.key

##
## datasource
##
spring.datasource.url=jdbc:h2:tcp://localhost/~/psoft-g1;IGNORECASE=TRUE
# ^ H2 Console needs to be running, and file needs to be previously created in path ^
#spring.datasource.url=jdbc:h2:~/psoft-g1
# ^ H2 Console CAN'T be running, and file needs to be previously created in path ^
#spring.datasource.url=jdbc:h2:mem:testdb
# ^ No prerequisites ^
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=mysqluser
spring.datasource.password=mysqlpass
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.jpa.hibernate.dialect=org.hibernate.dialect.H2Dialect

## show SQL
spring.jpa.show-sql=false
#hibernate.show_sql=false
#spring.jpa.hibernate.format_sql=true
#Ricardo: what is this for?

## database schema generation
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

##
## H2 console for development purposes.
## e.g., http://localhost:8080/h2-console
##
## for security reasons this setting should be false
spring.h2.console.enabled=true

##
## MULTIPART (MultipartProperties)
##
# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB
# Max file size.
spring.servlet.multipart.max-file-size=200MB
# Max Request Size
spring.servlet.multipart.max-request-size=215MB

##
## File Storage Properties
##
# All files uploaded through the REST API will be stored in this directory
file.upload-dir=uploads-psoft-g1
#Maximum photo size -> in bytes | by the rules of the forum it's 20KB
file.photo_max_size=20000

## Api Ninjas key
my.ninjas-key=a5nSlaa4JxIubY09H+NYuQ==cY9FegnFmAvYi6fN

##
## Lending-policy parameters (externally configurable at setup time; validated at startup).
## Override any value with an external ./config/application.properties, an env var, or --args
## (no rebuild). See ADR-0003. Values must satisfy each policy's constraints or startup fails.
##
# Standard policy (lending spec §2)
lending.policy.standard.maxActiveLendings=3
lending.policy.standard.lendingDurationInDays=15
lending.policy.standard.maxRenewals=3
lending.policy.standard.renewalDurationInDays=15
# Adaptive policy (lending spec §3): 0 < firstThreshold < secondThreshold < maxActiveLendings;
#                                     longPeriod > standardPeriod > shortPeriod > 0
lending.policy.adaptive.maxActiveLendings=5
lending.policy.adaptive.firstThreshold=2
lending.policy.adaptive.secondThreshold=4
lending.policy.adaptive.longPeriod=21
lending.policy.adaptive.standardPeriod=14
lending.policy.adaptive.shortPeriod=7
# Lending-policy selection (lending spec §4): minOnTimeRatio is a percentage (0-100)
lending.policy.selection.historyPeriodInMonths=12
lending.policy.selection.minCompletedLendings=5
lending.policy.selection.minOnTimeRatio=80

##
## Bibliographic sources (externally configurable). Each adapter (#3 Google Books, #4 Open Library)
## binds its own section. See ADR-0010. The API key is optional for Google Books.
##
bibliographic.google-books.base-url=https://www.googleapis.com/books/v1
#bibliographic.google-books.api-key=
bibliographic.google-books.timeout=5s
