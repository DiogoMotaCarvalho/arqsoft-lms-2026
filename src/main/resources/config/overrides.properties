# Externalized lending-policy parameters.
#
# Consumed by LendingPolicyFactory to build the domain policies at setup time, so limits
# change without code edits. The externalized-config mechanism itself is formalized in #9;
# this ticket (#8) only consumes it. Each policy validates these values at construction.

# Standard lending policy
lending.policy.standard.maxActiveLendings=3
lending.policy.standard.lendingDurationInDays=15
lending.policy.standard.maxRenewals=3
lending.policy.standard.renewalDurationInDays=15
