##
## Profiles
##
#spring.profiles.active=

## OpenAPI
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

## Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.environment=${APP_ENVIRONMENT:local}

## JWT
jwt.private.key=classpath:rsa.private.key
jwt.public.key=classpath:rsa.public.key

## datasource
#spring.datasource.url=jdbc:h2:tcp://localhost/~/psoft-g1
# ^ H2 Console needs to be running, and file needs to be previously created in path ^
#spring.datasource.url=jdbc:h2:~/psoft-g1
# ^ File needs to be previously created in path ^
spring.datasource.url=jdbc:h2:mem:testdb
# ^ No prerequisites ^
spring.datasource.username=mysqluser
spring.datasource.password=mysqlpass
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.driverClassName=org.h2.Driver

## database schema generation
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update


## MULTIPART (MultipartProperties)
# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB
# Max file size.
spring.servlet.multipart.max-file-size=200MB
# Max Request Size
spring.servlet.multipart.max-request-size=215MB

## File Storage Properties
# All files uploaded through the REST API will be stored in this directory
file.upload-dir=uploads-psoft-g1
#Maximum photo size -> in bytes | by the rules of the forum it's 20KB
file.photo_max_size=20000

## Api Ninjas key
my.ninjas-key=a5nSlaa4JxIubY09H+NYuQ==cY9FegnFmAvYi6fN

## Logging
logging.level.com.example.demo=DEBUG
#logging.level.org.springframework=DEBUG

##
## Lending-policy parameters (mirrors src/main defaults so the test context binds/validates). See ADR-0003.
##
# Standard policy (lending spec §2)
lending.policy.standard.maxActiveLendings=3
lending.policy.standard.lendingDurationInDays=15
lending.policy.standard.maxRenewals=3
lending.policy.standard.renewalDurationInDays=15
# Adaptive policy (lending spec §3)
lending.policy.adaptive.maxActiveLendings=5
lending.policy.adaptive.firstThreshold=2
lending.policy.adaptive.secondThreshold=4
lending.policy.adaptive.longPeriod=21
lending.policy.adaptive.standardPeriod=14
lending.policy.adaptive.shortPeriod=7
# Lending-policy selection (lending spec §4)
lending.policy.selection.historyPeriodInMonths=12
lending.policy.selection.minCompletedLendings=5
lending.policy.selection.minOnTimeRatio=80

##
## Notifications (issue #18, ADR-0014). Overdue-sweep cadence; mirrors src/main so the test context
## resolves the @Scheduled placeholder.
##
notifications.overdue.check-cron=0 0 2 * * *
